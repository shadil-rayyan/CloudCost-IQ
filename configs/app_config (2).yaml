# CloudCost IQ application configuration (MVP 1).
# Paths are relative to the project root unless absolute.
app_name: CloudCost IQ
app_version: 1.0.0
normalized_schema_version: "1.0"

storage:
  data_dir: data
  raw_dir: data/raw
  processed_dir: data/processed
  rejected_dir: data/rejected
  demo_dir: data/demo
  metadata_dir: data/metadata
  artifacts_dir: artifacts/models
  database_path: data/metadata/cloudcost_iq.db

uploads:
  max_file_size_mb: 512
  max_uncompressed_size_mb: 2048
  max_archive_members: 16
  max_rows: 5000000
  preview_rows: 50
  allowed_extensions: [csv, parquet, gz, zip]

reporting:
  # Reporting currency used for display grouping. Records are never converted.
  default_currency: USD
  default_cost_basis: billed
  allow_mixed_currency_totals: false
  fiscal_year_start_month: 1

budgets:
  monthly_budget: null

quality:
  min_history_days: 180
  preferred_history_days: 365
  min_daily_observations: 120
  max_gap_days: 7
  duplicate_warning_ratio: 0.01
  anomaly_zscore_threshold: 3.0
  anomaly_lookback_days: 28
